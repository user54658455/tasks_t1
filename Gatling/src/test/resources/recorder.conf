recorder {
    core {
        className=RecordedSimulation
        encoding=UTF-8
        format=java17
        harFilePath=""
        headless=false
        mode=Proxy
        package="io.gatling.demo"
        saveConfig=true
        thresholdForPauseCreation=100
    }
    filters {
        allowList=[]
        denyList=[]
        enable=false
    }
    http {
        automaticReferer=false
        checkResponseBodies=false
        followRedirect=true
        inferHtmlResources=false
        removeCacheHeaders=false
        useMethodAndUriAsPostfix=false
        useSimulationAsPrefix=false
    }
    proxy {
        https {
            mode=SelfSignedCertificate
        }
        port=8888
    }
}
